name: Deploy Cloud Run Job - telemetry_ingestion

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: openf1-1
  GCP_REGION: europe-west1
  GCP_JOB_NAME: telemetry-ingestion
  GCP_IMAGE_PATH: europe-west1-docker.pkg.dev/openf1-1/openf1/telemetry_ingestion

jobs:
  deploy:
    name: Deploy to Cloud Run Job
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t ${{ env.GCP_IMAGE_PATH }}:latest .
          echo "Pushing Docker image to Artifact Registry..."
          docker push ${{ env.GCP_IMAGE_PATH }}:latest

      - name: Deploy Cloud Run Job
        id: deploy
        run: |
          echo "Deploying/Updating Cloud Run Job: ${{ env.GCP_JOB_NAME }}"
          gcloud run jobs update ${{ env.GCP_JOB_NAME }} \
            --image ${{ env.GCP_IMAGE_PATH }}:latest \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet
          echo "Deployment configuration updated successfully."
